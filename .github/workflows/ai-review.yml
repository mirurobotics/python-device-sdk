# Required AI review of every non-draft PR into the staging SDK. Posts the
# `ai-review` status. See the reusable workflow for details.
#
# This file is hand-written custom code, not Stainless output: stlc seals it
# with the rest of the custom code and promote copies it to the production
# repo, where the job is skipped. Hand-written changes reach the SDK through
# PRs on the staging repo only.
#
# pull_request_target runs this file from the base branch, so a PR cannot
# edit or delete its own review.
#
# The reusable workflow is pinned to a commit, so a change to it only takes
# effect here through a reviewed PR that bumps the SHA.

name: AI Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  ai-review:
    if: ${{ endsWith(github.repository, '-staging') }}
    uses: mirurobotics/.github/.github/workflows/ai-review.yml@78e2fba753ddf238696af92184931ee08d3b0016
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
